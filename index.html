<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXONE ENG</title>
<meta name="description" content="NEXONE ENG — 현장 작업자를 위한 계산·도면 앱을 만듭니다.">
<style>
  :root{--bg:#0f1420;--panel:#171d2b;--line:#2b3550;--text:#e7ecf5;--muted:#93a0b8;--accent:#4da3ff}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,"Malgun Gothic",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  main{max-width:720px;margin:0 auto;padding:48px 20px 64px}
  h1{margin:0 0 6px;font-size:30px;letter-spacing:-.5px}
  .tag{color:var(--muted);margin:0 0 28px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px;margin:14px 0}
  .card h2{margin:0 0 6px;font-size:18px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  footer{margin-top:32px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>NEXONE ENG</h1>
  <p class="tag">현장 작업자를 위한 계산·도면 앱을 만듭니다.</p>

  <div class="card">
    <h2>배관뚝딱</h2>
    <p>배관 아이소메트릭 도면, 밴딩 마킹, 스풀 절단 리스트, 자재 산출을 한곳에서. 배관사가 현장에서 쓰려고 만든 앱입니다.</p>
    <p><a href="https://play.google.com/store/apps/details?id=com.iroir.isopipe">Google Play에서 보기</a></p>
  </div>

  <div class="card">
    <h2>모든 앱</h2>
    <p><a href="https://play.google.com/store/apps/developer?id=NEXONE+ENG">Google Play의 NEXONE ENG 앱 목록</a></p>
  </div>

  <div class="card">
    <h2>회사 소개</h2>
    <p><a href="https://sites.google.com/view/nexone-eng">NEXONE ENG 소개 페이지</a></p>
  </div>

  <footer>
    문의: <a href="mailto:loadguess@gmail.com">loadguess@gmail.com</a>
  </footer>
</main>
</body>
</html>
